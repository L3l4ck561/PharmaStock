<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

 
  </style>
</head>
<body>
<label>
  Ano:
  <input
    type="number"
    id="inputAno"
    min="1900"
    max="2100"
  />
</label>

<br><br>

<label>
  Mês:
  <select id="selectMes">
    <option value="">Selecione o mês</option>
    <option value="1">Janeiro</option>
    <option value="2">Fevereiro</option>
    <option value="3">Março</option>
    <option value="4">Abril</option>
    <option value="5">Maio</option>
    <option value="6">Junho</option>
    <option value="7">Julho</option>
    <option value="8">Agosto</option>
    <option value="9">Setembro</option>
    <option value="10">Outubro</option>
    <option value="11">Novembro</option>
    <option value="12">Dezembro</option>
  </select>
</label>

<br><br>

<label>
  Semana:
  <select id="selectSemana">
    <option value="">Selecione a semana</option>
  </select>
</label>

  <script>
const inputAno = document.getElementById("inputAno");
const selectMes = document.getElementById("selectMes");
const selectSemana = document.getElementById("selectSemana");

// inicia com o ano atual
const anoAtual = new Date().getFullYear();
inputAno.value = anoAtual;

inputAno.addEventListener("change", atualizar);
selectMes.addEventListener("change", atualizar);

function atualizar() {
  const ano = Number(inputAno.value);
  const mes = Number(selectMes.value);

  if (!ano || !mes) {
    selectSemana.innerHTML = `<option value="">Selecione a semana</option>`;
    return;
  }

  gerarSemanas(mes, ano);
}

function gerarSemanas(mes, ano) {
  selectSemana.innerHTML = `<option value="">Selecione a semana</option>`;

  // JS usa mês de 0 a 11
  const primeiroDiaMes = new Date(ano, mes - 1, 1);
  const ultimoDiaMes = new Date(ano, mes, 0);

  let data = new Date(primeiroDiaMes);

  // primeira segunda-feira do mês
  while (data.getDay() !== 1) {
    data.setDate(data.getDate() + 1);
  }

  while (data <= ultimoDiaMes) {
    const segunda = new Date(data);
    const sexta = new Date(data);
    sexta.setDate(segunda.getDate() + 4);

    // evita semanas que estouram o mês
    if (sexta.getMonth() !== mes - 1) break;

    const texto = `${formatar(segunda)} a ${formatar(sexta)}`;
    const value = formatar(sexta); // sexta-feira

    const option = document.createElement("option");
    option.value = value;
    option.textContent = texto;

    selectSemana.appendChild(option);

    data.setDate(data.getDate() + 7);
  }
}

function formatar(data) {
  const dia = String(data.getDate()).padStart(2, "0");
  const mes = String(data.getMonth() + 1).padStart(2, "0");
  const ano = data.getFullYear();
  return `${dia}/${mes}/${ano}`;
}

  </script>
</body>
</html>
